name: AgentOpsDeck
options:
  minimumXcodeGenVersion: 2.42.0
  deploymentTarget:
    iOS: "16.0"
configs:
  Debug: debug
  Release: release
configFiles:
  Debug: Config/Client.xcconfig
  Release: Config/Client.xcconfig
settings:
  base:
    SWIFT_VERSION: "5.0"
    TARGETED_DEVICE_FAMILY: "1,2"
    IPHONEOS_DEPLOYMENT_TARGET: "16.0"
targets:
  AgentOpsDeck:
    type: application
    platform: iOS
    sources:
      - Sources
      - Resources/Assets.xcassets
      - Resources/PrivacyInfo.xcprivacy
      - path: Resources/en.lproj
        buildPhase: resources
      - path: Resources/zh-Hans.lproj
        buildPhase: resources
      - path: Resources/ResourceRouting.js
        buildPhase: resources
    settings:
      base:
        INFOPLIST_FILE: Resources/Info.plist
        PRODUCT_BUNDLE_IDENTIFIER: "$(AOD_BUNDLE_ID)"
        PRODUCT_MODULE_NAME: AgentOpsDeck
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
  AgentOpsDeckTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - Tests
    dependencies:
      - target: AgentOpsDeck
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: "$(AOD_BUNDLE_ID).tests"
        PRODUCT_MODULE_NAME: AgentOpsDeckTests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  AgentOpsDeck:
    build:
      targets:
        AgentOpsDeck: all
    test:
      targets:
        - AgentOpsDeckTests
    archive:
      config: Release
